name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # The balance harness is dependency-free and runs whole careers headless,
      # so it doubles as a smoke test for the simulation.
      - run: npm run balance -- --careers 3 --until 40
