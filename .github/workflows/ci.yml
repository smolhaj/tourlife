name: CI

# Manual only. The same suites run locally in ~45s via the pre-push hook
# (`git config core.hooksPath scripts/hooks`), so this costs nothing unless you
# deliberately trigger it from the Actions tab — useful for checking a branch
# you did not build locally, or a contributor's pull request.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Scenario tests play whole careers and assert the invariants that should
      # always hold; hostile tests throw malformed saves and extreme godmode
      # values at it; the fuzzer hammers random legal action sequences.
      - run: npm run scenarios
      - run: npm run hostile
      - run: npm run fuzz -- --runs 20 --steps 250
      # The balance harness checks the numbers still land where we want them.
      - run: npm run balance -- --careers 3 --until 40
