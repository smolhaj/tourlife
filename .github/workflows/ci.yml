name: CI

# This repository is public, so GitHub-hosted runner minutes are not metered —
# the API reports 0 billable ms per run. Nothing here draws down a quota.
# The same suites also run locally in ~45s via the pre-push hook
# (`git config core.hooksPath scripts/hooks`); CI is the clean-checkout check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Scenario tests play whole careers and assert the invariants that should
      # always hold; hostile tests throw malformed saves and extreme godmode
      # values at it; the fuzzer hammers random legal action sequences.
      - run: npm run scenarios
      - run: npm run hostile
      - run: npm run fuzz -- --runs 20 --steps 250
      # The balance harness checks the numbers still land where we want them.
      - run: npm run balance -- --careers 3 --until 40
