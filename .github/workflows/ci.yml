name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Scenario tests play whole careers through the engine and assert the
      # invariants that should always hold. ~9s, no dependencies.
      - run: npm run scenarios
      # The balance harness checks the numbers still land where we want them.
      - run: npm run balance -- --careers 3 --until 40
